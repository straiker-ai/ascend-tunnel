# Release: signed, checksummed, attested binaries for every platform, plus the package-manager
# manifests. Every publish step that needs a credential is skipped when that credential is absent,
# so a snapshot build (`goreleaser release --snapshot --clean`) works anywhere.
version: 2
project_name: ascend-tunnel

before:
  hooks:
    - go mod verify

builds:
  - id: ascend-tunnel
    main: ./cmd/ascend-tunnel
    binary: ascend-tunnel
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible: same commit, same bytes
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    hooks:
      post: &sign
        # Authenticode-signs Windows binaries when signing is configured; a no-op otherwise.
        - cmd: sh scripts/sign-windows.sh "{{ .Path }}"
          output: true
        # Developer ID-signs and notarizes darwin binaries on a macOS runner with the keychain set up
        # (scripts/macos-keychain.sh); a no-op elsewhere, and a failure on a tag (REQUIRE_MACOS_SIGNING).
        - cmd: bash scripts/sign-macos.sh "{{ .Path }}" "{{ .Os }}"
          output: true
  # The person's terminal for Ascend Agent; signed like the tunnel agent.
  - id: ascend-agent
    main: ./cmd/ascend-agent
    binary: ascend-agent
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    hooks:
      post: *sign

archives:
  - id: ascend-tunnel
    ids: [ascend-tunnel]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, config.example.yaml]
  - id: ascend-agent
    ids: [ascend-agent]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ascend-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, docs/ascend-agent.md]

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: .vex/*.openvex.json

# An SPDX SBOM per archive (syft), published beside it, in checksums.txt and in the build provenance.
sboms:
  - artifacts: archive

nfpms:
  - id: packages
    ids: [ascend-tunnel]
    package_name: ascend-tunnel
    vendor: Straiker
    homepage: https://github.com/straiker-ai/ascend-tunnel
    maintainer: Straiker <support@straiker.ai>
    description: Outbound-only tunnel agent that lets Straiker Ascend reach AI apps in a private network.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/ascend-tunnel.service
        dst: /usr/lib/systemd/system/ascend-tunnel.service
      - src: config.example.yaml
        dst: /etc/straiker/agent.yaml
        type: config|noreplace
        file_info:
          mode: 0644

# Homebrew: one cask per binary in straiker-ai/homebrew-tap (brew install straiker-ai/tap/ascend-tunnel,
# .../ascend-agent); ascend-agent's depends on ascend-tunnel's. Both carry the release's version.
# Generated only (dist/homebrew/Casks): release.yml pushes them to the tap after it publishes the
# release (scripts/publish-casks.sh), since a cask pushed here would point at a draft release's
# downloads, which 404 until publish - and forever if the job fails before it.
homebrew_casks:
  - name: ascend-tunnel
    ids: [ascend-tunnel]
    homepage: https://github.com/straiker-ai/ascend-tunnel
    description: Outbound-only tunnel agent for Straiker Ascend
    license: Apache-2.0
    repository:
      owner: straiker-ai
      name: homebrew-tap
    skip_upload: true
  - name: ascend-agent
    ids: [ascend-agent]
    homepage: https://github.com/straiker-ai/ascend-tunnel/blob/main/docs/ascend-agent.md
    description: Serves tools to Straiker's cloud agents, under a policy you own
    license: Apache-2.0
    # Ascend Agent sets up the tunnel for a local app, so installing it brings ascend-tunnel too (on PATH,
    # beside it in Homebrew's bin). The tunnel still installs alone, for a server that only tunnels.
    dependencies:
      - cask: straiker-ai/tap/ascend-tunnel
    repository:
      owner: straiker-ai
      name: homebrew-tap
    skip_upload: true

scoops:
  - name: ascend-tunnel
    ids: [ascend-tunnel]
    homepage: https://github.com/straiker-ai/ascend-tunnel
    description: Outbound-only tunnel agent for Straiker Ascend
    license: Apache-2.0
    repository:
      owner: straiker-ai
      name: scoop-bucket
    # Generated only: straiker-ai/scoop-bucket doesn't exist yet, and an upload here would point at the
    # draft release (see homebrew_casks). Publish it after the release, as the casks are, once it does.
    skip_upload: true

winget:
  - name: AscendTunnel
    ids: [ascend-tunnel]
    publisher: Straiker
    package_identifier: Straiker.AscendTunnel
    short_description: Outbound-only tunnel agent for Straiker Ascend
    license: Apache-2.0
    publisher_url: https://www.straiker.ai
    homepage: https://github.com/straiker-ai/ascend-tunnel
    repository:
      owner: straiker-ai
      name: winget-pkgs
      branch: "ascend-tunnel-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    # Generated only: the straiker-ai/winget-pkgs fork doesn't exist yet, and the PR would point at the
    # draft release (see homebrew_casks). Publish it after the release, as the casks are, once it does.
    skip_upload: true

release:
  github:
    owner: straiker-ai
    name: ascend-tunnel
  # Immutable releases: everything goes up to a draft; release.yml publishes it last, and then it cannot change.
  draft: true
  replace_existing_draft: true
  # OpenVEX: findings a scanner reports that do not apply, and why (trivy --vex <file>).
  extra_files:
    - glob: .vex/*.openvex.json
  footer: |
    Verify a download: `gh attestation verify <file> --repo straiker-ai/ascend-tunnel`
    and check it against `checksums.txt`.

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]
