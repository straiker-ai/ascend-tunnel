name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    # macOS: codesign and notarytool exist only there. Go cross-compiles every other platform from it.
    runs-on: macos-14
    # Signing keys and the package token are secrets of this environment, which only v* tags (created
    # by admins only) may use - never repo secrets, which any branch's workflow could read.
    environment: release
    permissions:
      contents: write     # the GitHub release
      id-token: write     # Sigstore signing of the build provenance
      attestations: write
    env:
      # Each credential is optional (the `release` environment's secrets): its step is skipped when absent.
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}               # homebrew-tap, scoop-bucket, winget-pkgs fork
      # macOS, as straiker-ai/sentry signs: the same Developer ID certificate and Apple ID. Required on a tag.
      REQUIRE_MACOS_SIGNING: "1"
      MACOS_APP_P12: ${{ secrets.MACOS_APP_P12 }}                 # Developer ID Application, base64 .p12
      MACOS_APP_P12_PASSWORD: ${{ secrets.MACOS_APP_P12_PASSWORD }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}       # app-specific password, for notarytool
      APPLE_ID: ${{ vars.APPLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      JSIGN_STORETYPE: ${{ secrets.JSIGN_STORETYPE }}             # Windows Authenticode via a cloud HSM
      JSIGN_KEYSTORE: ${{ secrets.JSIGN_KEYSTORE }}
      JSIGN_STOREPASS: ${{ secrets.JSIGN_STOREPASS }}
      JSIGN_ALIAS: ${{ secrets.JSIGN_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install jsign
        if: env.JSIGN_STORETYPE != ''
        run: brew install jsign
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: create the signing keychain
        run: scripts/macos-keychain.sh create
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.sbom.json
            dist/checksums.txt
      # Last, once every asset and its provenance exist: the repository's immutable releases lock it from here.
      - name: publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # After publish, so a cask never points at a draft release's downloads (.goreleaser.yaml only generates
      # them). Prerelease tags skip it.
      - name: publish the Homebrew casks
        if: env.PACKAGES_TOKEN != ''
        run: scripts/publish-casks.sh
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: delete the signing keychain
        if: always()
        run: scripts/macos-keychain.sh delete

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/straiker-ai/ascend-tunnel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM and full build provenance, attached to the image for registry scanners.
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.commit.outputs.short }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/straiker-ai/ascend-tunnel
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
